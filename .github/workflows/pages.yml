name: Publier Tanjaka

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers de l'application
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll icon-192.png icon-512.png tanjaka.*.css tanjaka.*.js _site/
      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier l'application
        id: deployment
        uses: actions/deploy-pages@v4
